# cargo-deny configuration (docs/16-p0-checkpoint.md P1: dependency/
# supply-chain hygiene, part of the "add CI" item from the post-Phase-6
# audit roadmap). Run with `cargo deny check`.
#
# `cargo-audit` itself isn't installed in this environment; `cargo deny
# check advisories` covers the same RustSec advisory database and is
# already needed here for the license/bans/sources checks, so it does
# double duty rather than adding a second tool.

[graph]
all-features = false
no-default-features = false

[advisories]
# Every entry here was triaged by hand (docs/16-p0-checkpoint.md) — none
# are silently suppressed. Re-run `cargo deny check advisories` and
# re-triage before removing an entry, not just to make CI green again.
ignore = [
    # --- Transitive only, via the solana-sdk/solana-client dependency
    # tree, no fix available without an upstream solana-sdk major-version
    # bump, and none of these crates' unmaintained/flagged functionality
    # is reachable from this service's own code paths.
    { id = "RUSTSEC-2024-0375", reason = "atty unmaintained; pulled in by solana-logger, never invoked by this service" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; this service decodes everything by hand (see solana::accounts/goldcoin::rpc module docs) and never calls into bincode itself" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained; transitive via solana ecosystem proc-macro usage, not a runtime dependency of this service's own code" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained; transitive, not used by this service" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive proc-macro dependency, not a runtime dependency of this service's own code" },
    { id = "RUSTSEC-2026-0097", reason = "rand::rng() unsound only when combined with a custom log::Log implementation installed via log::set_logger; this service uses tracing/tracing-subscriber, never log::set_logger, so the unsound path is not reachable" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name-constraint bug; transitive via solana-pubsub-client's websocket stack (rustls 0.21). This service never uses the pubsub/websocket client, only blocking/async RPC HTTP calls (solana::rpc::RealSolanaRpc), and never parses certificates with name constraints. No fix available without a solana-sdk major-version bump (a newer rustls-webpki is already present elsewhere in the tree, just not reachable from this transitive edge)." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name-constraint bug; same unreachable transitive path as RUSTSEC-2026-0098" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL-parsing panic; this service never fetches or parses a certificate revocation list. Same unreachable transitive path as RUSTSEC-2026-0098" },

    # --- Direct dependencies of this crate, genuinely worth tracking,
    # but not fixed in this pass — see docs/16-p0-checkpoint.md for the
    # reasoning and the P2 item this should become before production.
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek timing side-channel in Scalar sub; transitive via ed25519-dalek 1.0.1, which solana-sdk pins directly (Keypair/signature verification) — this service's own attestation signing (signing::attestation) runs on top of solana_sdk::signature::Keypair, so this IS on this bridge's real ed25519 signing path, not just incidental. No fix available without solana-sdk bumping its own ed25519-dalek pin. Flagged for a P2 security-review item, not silently ignored." },
    { id = "RUSTSEC-2022-0093", reason = "ed25519-dalek 1.0.1 double-public-key oracle; same solana-sdk-pinned dependency and same P2 flag as RUSTSEC-2024-0344 above — this service never accepts an externally-supplied public key for a signature it didn't generate the message for (every signer re-derives its own claim, see signing module docs), which is the specific misuse this advisory warns about, but the dependency itself remains outdated pending a solana-sdk upgrade." },
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 0.6 unmaintained upstream — this IS a direct dependency of this service, used for real Goldcoin vault secp256k1 signing (signing::goldcoin_vault). Pinned specifically for rand 0.7/rand_core 0.5 ABI compatibility (see Cargo.toml comment). Flagged as a genuine P2 item: evaluate migrating to an actively-maintained secp256k1 crate (e.g. the `secp256k1` crate proper, or `k256`) before production custody keys are ever used with this code path, not silently ignored." },
]

[licenses]
version = 2
# This dependency tree is entirely permissively-licensed open source
# (mostly MIT/Apache-2.0 dual-licensed, as is normal for the Rust
# ecosystem); nothing copyleft or otherwise incompatible with this
# project's own MIT license (see Cargo.toml) was found.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of common crates (e.g. multiple `syn`/`base64`/
# `rand` versions) are the normal, expected state of the Solana
# ecosystem's dependency tree at this snapshot in time, not a bug in
# this workspace — warn so it's visible, don't fail CI on it.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
