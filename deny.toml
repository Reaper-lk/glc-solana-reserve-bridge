# cargo-deny configuration for the on-chain workspace (programs/, shared/)
# — see service/deny.toml for the off-chain service's separate config
# (these are two genuinely separate Cargo workspaces, docs/08-migration-
# strategy.md). Run with `cargo deny check` from this directory.

[graph]
all-features = false
no-default-features = false

[advisories]
# Every entry here was triaged by hand (docs/16-p0-checkpoint.md). Same
# reasoning as service/deny.toml where the same advisory recurs — this
# workspace pulls a similar (older, anchor-lang-pinned) solana-sdk
# dependency tree. Re-triage before removing an entry, not just to make
# CI green again.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via the anchor-lang/solana-sdk dependency tree, not called directly by this program's own code" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained; transitive proc-macro dependency" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive proc-macro dependency" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via the litesvm/reqwest test-harness dependency chain (programs/glc-reserve-bridge/tests), never reachable from the on-chain program binary itself" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name-constraint bug; transitive via the litesvm/reqwest test-harness dependency chain, not the on-chain program binary. No production TLS/certificate parsing happens in this workspace at all." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name-constraint bug; same unreachable test-only transitive path as RUSTSEC-2026-0098" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL-parsing panic; same unreachable test-only transitive path as RUSTSEC-2026-0098" },

    # --- Genuinely worth tracking, not fixed in this pass — see
    # service/deny.toml for the identical reasoning (this workspace's
    # test harness pulls the same pinned versions); flagged as a P2 item.
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek timing side-channel via ed25519-dalek 1.0.1, solana-sdk-pinned. Not reachable from the on-chain program's own instruction logic (it verifies attestation signatures via the ed25519 program/sysvar, never calls ed25519-dalek directly), but present in the dependency tree via solana-sdk. Flagged for the same P2 item as service/deny.toml." },
    { id = "RUSTSEC-2022-0093", reason = "ed25519-dalek 1.0.1 double-public-key oracle; same solana-sdk-pinned dependency and same P2 flag as RUSTSEC-2024-0344 above" },
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 unmaintained upstream; pulled in by this workspace's test harness (programs/glc-reserve-bridge/tests), not the on-chain program binary itself. Same P2 tracking item as service/deny.toml." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
